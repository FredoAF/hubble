apiVersion: batch/v1
kind: CronJob
metadata:
  name: traffic
  namespace: traffic
spec:
  schedule: "0/5 6-9 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: traffic
              image: ghcr.io/fredoaf/traffic-alerts:edge
              imagePullPolicy: IfNotPresent
              env:
                - name: REDIS_HOST
                  value: redis-service.redis.svc.cluster.local
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: API_KEY
                      name: apikey
          restartPolicy: OnFailure
