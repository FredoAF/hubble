# Screenshots for the A5 Traffic dashboard text panel.
# Mounted into Grafana at /usr/share/grafana/public/img/a5 and served at /public/img/a5/<name>.
# Regenerate from traffic-display/app/static with:
#   kubectl create configmap a5-images -n grafana --from-file=screen.png --from-file=google.png --from-file=apple.png --dry-run=client -o yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: a5-images
  namespace: grafana
binaryData:
  screen.png: 
  google.png: 
  apple.png: 
